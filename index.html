<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dune : Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Dune : Genesis — un jeu de fan inspiré des trois films de Denis Villeneuve.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --ink:#eadcc4; --ochre:#d9a05b; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
    font-family:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;color:var(--ink);}
  canvas{display:block;position:absolute;left:0;top:0;outline:none;cursor:default}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:0;bottom:0;width:46%;height:60%;pointer-events:auto}
  #stick i{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:1.5px solid rgba(234,220,196,.45);
    border-radius:50%;display:none;background:rgba(234,220,196,.06)}
  #stick i b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(234,220,196,.35)}
  .tb{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;
    border:1.5px solid rgba(234,220,196,.5);background:rgba(20,12,6,.35);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .tb.dn{background:rgba(217,160,91,.45)}
  #tb-a{right:26px;bottom:34px}
  #tb-b{right:116px;bottom:18px}
  #tb-c{right:26px;bottom:124px}
  #tb-d{right:116px;bottom:108px}
  #tb-p{left:50%;top:10px;margin-left:-26px;width:52px;height:34px;border-radius:17px;font-size:11px}
  #noscript{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="touch">
  <div id="stick"><i><b></b></i></div>
  <div class="tb" id="tb-a" data-k="Space">Act</div>
  <div class="tb" id="tb-b" data-k="ShiftLeft">Esq</div>
  <div class="tb" id="tb-c" data-k="KeyE">Pose</div>
  <div class="tb" id="tb-d" data-k="KeyJ">Fer</div>
  <div class="tb" id="tb-p" data-k="Escape">II</div>
</div>
<noscript><div id="noscript">Dune : Genesis nécessite JavaScript.</div></noscript>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/scene-menu.js"></script>
<script src="js/scene-thopter.js"></script>
<script src="js/scene-trek.js"></script>
<script src="js/scene-ride.js"></script>
<script src="js/scene-vision.js"></script>
<script src="js/scene-duel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
