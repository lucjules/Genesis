<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dune : Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Dune : Genesis — un jeu de fan inspiré des trois films de Denis Villeneuve.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --ink:#eadcc4; --ochre:#d9a05b; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
    font-family:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;color:var(--ink);}
  canvas{display:block;position:absolute;left:0;top:0;outline:none;cursor:default}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:0;bottom:0;width:46%;height:60%;pointer-events:auto}
  #stick i{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:1.5px solid rgba(234,220,196,.45);
    border-radius:50%;display:none;background:rgba(234,220,196,.06)}
  #stick i b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(234,220,196,.35)}
  .tb{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;
    border:1.5px solid rgba(234,220,196,.5);background:rgba(20,12,6,.35);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .tb.dn{background:rgba(217,160,91,.45)}
  #tb-a{right:26px;bottom:34px}
  #tb-b{right:116px;bottom:18px}
  #tb-c{right:26px;bottom:124px}
  #tb-d{right:116px;bottom:108px}
  #tb-p{left:50%;top:10px;margin-left:-26px;width:52px;height:34px;border-radius:17px;font-size:11px}
  #noscript{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="touch">
  <div id="stick"><i><b></b></i></div>
  <div class="tb" id="tb-a" data-k="Space">Act</div>
  <div class="tb" id="tb-b" data-k="ShiftLeft">Esq</div>
  <div class="tb" id="tb-c" data-k="KeyE">Pose</div>
  <div class="tb" id="tb-d" data-k="KeyJ">Fer</div>
  <div class="tb" id="tb-p" data-k="Escape">II</div>
</div>
<noscript><div id="noscript">Dune : Genesis nécessite JavaScript.</div></noscript>

<script>
/* js/core.js */
/* Dune : Genesis — socle : utilitaires, bruit, entrées, boucle, scènes, post-traitement */
(function () {
'use strict';
const G = window.G = { W: 1280, H: 720, scenes: {}, time: 0, TAU: Math.PI * 2 };
const TAU = G.TAU;

/* ---------- maths ---------- */
G.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
G.lerp = (a, b, t) => a + (b - a) * t;
G.smooth = (a, b, x) => { const t = G.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
G.rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
G.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
G.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
G.angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
G.rng = function (seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

/* ---------- bruit de valeur ---------- */
function hash2(ix, iy, seed) {
  let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct, seed) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, seed + i * 17); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
G.hash2 = hash2; G.vnoise = vnoise; G.fbm = fbm;

/* ---------- texte ---------- */
const FD = '"Cinzel","Trajan Pro","Optima","Palatino Linotype",Georgia,serif';
const FB = '"Cormorant Garamond","Palatino Linotype","Book Antiqua",Georgia,serif';
G.font = (size, weight, fam) => `${weight || 400} ${size}px ${fam === 'body' ? FB : FD}`;
G.text = function (ctx, s, x, y, o) {
  o = o || {};
  ctx.save();
  ctx.font = G.font(o.size || 24, o.weight, o.fam);
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.globalAlpha *= (o.alpha === undefined ? 1 : o.alpha);
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = o.shadowBlur || 8; }
  ctx.fillStyle = o.color || '#eadcc4';
  ctx.fillText(s, x, y);
  ctx.restore();
};
G.wrap = function (ctx, s, maxW, font) {
  ctx.save(); ctx.font = font;
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  ctx.restore();
  return lines;
};
G.paragraph = function (ctx, s, x, y, maxW, lineH, o) {
  o = o || {};
  const f = G.font(o.size || 24, o.weight, o.fam);
  const lines = G.wrap(ctx, s, maxW, f);
  lines.forEach((l, i) => G.text(ctx, l, x, y + i * lineH, o));
  return lines.length * lineH;
};

/* ---------- entrées ---------- */
const keys = {}, pressedSet = new Set();
G.mouse = { x: 640, y: 360, down: false, clicked: false, moved: false };
G.stick = { x: 0, y: 0 };
G.keys = keys; G.pressedSet = pressedSet;
G.key = (c) => !!keys[c];
G.hit = (c) => pressedSet.has(c);
G.anyKey = (...c) => c.some((k) => keys[k]);
G.anyHit = (...c) => c.some((k) => pressedSet.has(k));
G.axis = function () {
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  if (G.stick.x || G.stick.y) { x = G.stick.x; y = G.stick.y; }
  const l = Math.hypot(x, y);
  if (l > 1) { x /= l; y /= l; }
  return { x, y, len: l > 1 ? 1 : l };
};
G.confirm = () => G.anyHit('Enter', 'Space', 'NumpadEnter') || G.mouse.clicked;
G.firstInput = false;
function onFirst() {
  if (!G.firstInput) { G.firstInput = true; if (G.audio) G.audio.init(); }
  else if (G.audio) G.audio.resume();
}
function toggleFullscreen() {
  try {
    let pr = null;
    if (document.fullscreenElement) pr = document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) pr = document.documentElement.requestFullscreen();
    if (pr && pr.catch) pr.catch(() => {});
  } catch (err) { /* plein écran indisponible */ }
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF' && !e.repeat && !e.ctrlKey && !e.metaKey && G.curName !== 'duel') toggleFullscreen();
  if (!keys[e.code]) pressedSet.add(e.code);
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  onFirst();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- canvas ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
G.canvas = canvas; G.ctx = ctx;
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  scale = Math.min(canvas.width / G.W, canvas.height / G.H);
  offX = (canvas.width - G.W * scale) / 2; offY = (canvas.height - G.H * scale) / 2;
}
window.addEventListener('resize', resize); resize();
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  G.mouse.x = ((e.clientX - r.left) * dpr - offX) / scale;
  G.mouse.y = ((e.clientY - r.top) * dpr - offY) / scale;
  G.mouse.moved = true;
}
canvas.addEventListener('mousemove', toLogical);
canvas.addEventListener('mousedown', (e) => { toLogical(e); G.mouse.down = true; G.mouse.clicked = true; onFirst(); keys.Mouse0 = true; pressedSet.add('Mouse0'); });
window.addEventListener('mouseup', () => { G.mouse.down = false; keys.Mouse0 = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* tactile */
(function touchInit() {
  const root = document.getElementById('touch');
  let isTouch = false;
  function enable() { if (isTouch) return; isTouch = true; G.isTouch = true; root.classList.add('on'); }
  window.addEventListener('touchstart', enable, { passive: true });
  const stickEl = document.getElementById('stick'), knob = stickEl.querySelector('i'), nub = knob.querySelector('b');
  let sid = null, ox = 0, oy = 0;
  stickEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0]; sid = t.identifier; ox = t.clientX; oy = t.clientY;
    knob.style.display = 'block'; knob.style.left = ox + 'px'; knob.style.top = (oy - stickEl.getBoundingClientRect().top) + 'px';
    nub.style.transform = 'translate(0,0)'; onFirst(); e.preventDefault();
  }, { passive: false });
  stickEl.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) if (t.identifier === sid) {
      let dx = t.clientX - ox, dy = t.clientY - oy; const l = Math.hypot(dx, dy), m = 55;
      if (l > m) { dx = dx / l * m; dy = dy / l * m; }
      nub.style.transform = `translate(${dx}px,${dy}px)`;
      G.stick.x = Math.abs(dx) > 8 ? dx / m : 0; G.stick.y = Math.abs(dy) > 8 ? dy / m : 0;
    }
    e.preventDefault();
  }, { passive: false });
  const end = (e) => { for (const t of e.changedTouches) if (t.identifier === sid) { sid = null; G.stick.x = G.stick.y = 0; knob.style.display = 'none'; } };
  stickEl.addEventListener('touchend', end); stickEl.addEventListener('touchcancel', end);
  document.querySelectorAll('.tb').forEach((b) => {
    const k = b.dataset.k;
    b.addEventListener('touchstart', (e) => { if (!keys[k]) pressedSet.add(k); keys[k] = true; b.classList.add('dn'); onFirst(); e.preventDefault(); }, { passive: false });
    const up = (e) => { keys[k] = false; b.classList.remove('dn'); e.preventDefault(); };
    b.addEventListener('touchend', up, { passive: false }); b.addEventListener('touchcancel', up, { passive: false });
  });
  canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; toLogical(t); G.mouse.clicked = true; G.mouse.down = true; onFirst(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', () => { G.mouse.down = false; });
})();

/* ---------- sauvegarde ---------- */
G.save = { chapter: 0, best: {} };
try { const s = localStorage.getItem('dune-genesis'); if (s) Object.assign(G.save, JSON.parse(s)); } catch (e) { /* stockage indisponible */ }
G.persist = () => { try { localStorage.setItem('dune-genesis', JSON.stringify(G.save)); } catch (e) { /* ignore */ } };
G.run = { spice: 0, truth: null, hayt: null, deaths: 0 };

/* ---------- sous-titres ---------- */
G.subQ = []; G.subCur = null;
G.say = function (text, who, dur) {
  G.subQ.push({ text, who: who || '', dur: dur || (2.2 + text.length * 0.045), t: 0 });
};
G.clearSubs = () => { G.subQ.length = 0; G.subCur = null; };
function updateSubs(dt) {
  if (!G.subCur && G.subQ.length) G.subCur = G.subQ.shift();
  if (G.subCur) { G.subCur.t += dt; if (G.subCur.t > G.subCur.dur) G.subCur = null; }
}
function drawSubs(c) {
  const s = G.subCur; if (!s) return;
  const a = Math.min(1, s.t / 0.3, (s.dur - s.t) / 0.4);
  c.save(); c.globalAlpha = Math.max(0, a);
  const f = G.font(25, 500, 'body');
  const lines = G.wrap(c, s.text, 900, f);
  const y0 = G.H - 62 - (lines.length - 1) * 30;
  const w = Math.min(960, Math.max(...lines.map((l) => { c.font = f; return c.measureText(l).width; })) + 70);
  const g = c.createLinearGradient(0, y0 - 70, 0, G.H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  c.fillStyle = g; c.fillRect(0, y0 - 70, G.W, G.H - y0 + 70);
  if (s.who) G.text(c, s.who.toUpperCase(), G.W / 2, y0 - 34, { size: 12, align: 'center', ls: 5, color: '#d9a05b' });
  lines.forEach((l, i) => G.text(c, l, G.W / 2, y0 + i * 30, { size: 25, weight: 500, fam: 'body', align: 'center', color: '#f1e6d2' }));
  c.restore();
  void w;
}

/* ---------- effets post ---------- */
const grainTiles = [], grainPat = [];
for (let n = 0; n < 4; n++) {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'), id = gc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0); grainTiles.push(g);
}
const vig = document.createElement('canvas'); vig.width = 640; vig.height = 360;
(function () {
  const v = vig.getContext('2d');
  const g = v.createRadialGradient(320, 180, 120, 320, 180, 400);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.65, 'rgba(0,0,0,.18)'); g.addColorStop(1, 'rgba(0,0,0,.72)');
  v.fillStyle = g; v.fillRect(0, 0, 640, 360);
})();
G.bars = 0; G.barsTarget = 0;
G.shake = 0; G.flash = 0; G.flashColor = '#fff';
G.grade = null;       // {color, alpha, mode}
G.grainAmt = 0.07;

function post(c, dt) {
  // étalonnage global
  if (G.grade) {
    c.save(); c.globalAlpha = G.grade.alpha * 0.7;
    c.fillStyle = G.grade.color; c.fillRect(0, 0, G.W, G.H); c.restore();
  }
  c.drawImage(vig, 0, 0, G.W, G.H);
  // grain argentique (motif répété : pas de jointures visibles)
  if (G.grainAmt > 0) {
    c.save(); c.globalAlpha = G.grainAmt * 0.5;
    const k = (Math.random() * 4) | 0, ox = ((Math.random() * 256) | 0) * 2, oy = ((Math.random() * 256) | 0) * 2;
    if (!grainPat[k]) { grainPat[k] = c.createPattern(grainTiles[k], 'repeat'); if (grainPat[k].setTransform && window.DOMMatrix) grainPat[k].setTransform(new DOMMatrix([2, 0, 0, 2, 0, 0])); }
    c.translate(-ox, -oy); c.fillStyle = grainPat[k]; c.fillRect(ox, oy, G.W, G.H);
    c.restore();
  }
  // flash
  if (G.flash > 0.01) { c.save(); c.globalAlpha = Math.min(1, G.flash); c.fillStyle = G.flashColor; c.fillRect(0, 0, G.W, G.H); c.restore(); G.flash *= Math.pow(0.02, dt); }
  // bandes cinéma
  G.bars += (G.barsTarget - G.bars) * Math.min(1, dt * 3);
  if (G.bars > 0.5) { c.fillStyle = '#000'; c.fillRect(0, 0, G.W, G.bars); c.fillRect(0, G.H - G.bars, G.W, G.bars); }
}

/* ---------- scènes & transitions ---------- */
G.cur = null; G.curName = '';
const trans = { phase: 'none', t: 0, dur: 0.7, next: null, opts: null };
G.fadeA = 0;
G.busy = () => !!trans.next;
G.go = function (name, opts, fast) {
  if (!G.scenes[name]) { console.error('scène inconnue', name); return; }
  if (trans.next) return;
  if (!G.cur) { enter(name, opts); trans.phase = 'in'; trans.t = 0; return; }
  trans.phase = 'out'; trans.t = 0; trans.next = name; trans.opts = opts; trans.dur = fast ? 0.35 : 0.8;
  G.failState = null; G.paused = false;
};
function enter(name, opts) {
  if (G.cur && G.cur.exit) G.cur.exit();
  G.clearSubs(); G.shake = 0; G.grade = null; G.barsTarget = 0; G.grainAmt = 0.07;
  G.cur = G.scenes[name]; G.curName = name;
  G.cur.enter(opts || {});
}
G.fail = function (title, text, retry) {
  G.failState = { title, text, retry, t: 0 };
  G.run.deaths++;
  if (G.audio) G.audio.sfx.fail();
};
G.paused = false;
G.pauseIdx = 0;

function drawFail(c) {
  const f = G.failState; const a = G.smooth(0, 0.8, f.t);
  c.save(); c.globalAlpha = a * 0.78; c.fillStyle = '#050302'; c.fillRect(0, 0, G.W, G.H); c.restore();
  c.save(); c.globalAlpha = a;
  G.text(c, f.title, G.W / 2, 310, { size: 44, align: 'center', ls: 8, color: '#e8d2ad', weight: 500 });
  G.paragraph(c, f.text, G.W / 2, 362, 760, 34, { size: 26, fam: 'body', align: 'center', color: '#bda98c' });
  const blink = 0.55 + 0.45 * Math.sin(G.time * 3);
  c.globalAlpha = a * blink;
  G.text(c, 'ENTRÉE — RÉESSAYER      ÉCHAP — MENU', G.W / 2, 500, { size: 14, align: 'center', ls: 5, color: '#d9a05b' });
  c.restore();
}
const PAUSE_ITEMS = ['Reprendre', 'Son : ', 'Quitter vers le titre'];
function drawPause(c) {
  c.save(); c.fillStyle = 'rgba(5,3,2,.72)'; c.fillRect(0, 0, G.W, G.H);
  G.text(c, 'PAUSE', G.W / 2, 250, { size: 40, align: 'center', ls: 12 });
  PAUSE_ITEMS.forEach((it, i) => {
    let s = it; if (i === 1) s += (G.audio && G.audio.muted ? 'coupé' : 'actif');
    const sel = i === G.pauseIdx;
    G.text(c, s.toUpperCase(), G.W / 2, 340 + i * 54, { size: 20, align: 'center', ls: 6, color: sel ? '#f4c27c' : '#8f7f68' });
    if (sel) { c.fillStyle = '#d9a05b'; c.fillRect(G.W / 2 - 150, 354 + i * 54, 300, 1); }
  });
  c.restore();
}
function updatePause() {
  if (G.anyHit('ArrowUp', 'KeyW')) G.pauseIdx = (G.pauseIdx + 2) % 3;
  if (G.anyHit('ArrowDown', 'KeyS')) G.pauseIdx = (G.pauseIdx + 1) % 3;
  // survol souris
  if (G.mouse.moved) for (let i = 0; i < 3; i++) if (Math.abs(G.mouse.x - G.W / 2) < 200 && Math.abs(G.mouse.y - (333 + i * 54)) < 24) G.pauseIdx = i;
  if (G.anyHit('Enter', 'Space') || (G.mouse.clicked && Math.abs(G.mouse.x - G.W / 2) < 220)) {
    if (G.pauseIdx === 0) G.paused = false;
    else if (G.pauseIdx === 1) G.audio.toggleMute();
    else { G.paused = false; G.go('title'); }
  }
}

/* ---------- boucle ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; G.time += dt;
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#000'; c.fillRect(0, 0, canvas.width, canvas.height);
  c.setTransform(scale, 0, 0, scale, offX, offY);
  c.save(); c.beginPath(); c.rect(0, 0, G.W, G.H); c.clip();

  // pause
  if (G.cur && !G.failState && !trans.next && G.hit('Escape') && G.curName !== 'title') { G.paused = !G.paused; G.pauseIdx = 0; if (G.audio) G.audio.duck(G.paused); }
  if (G.paused) updatePause();
  else if (G.failState) {
    G.failState.t += dt;
    if (G.failState.t > 0.6 && G.anyHit('Enter', 'Space')) { const r = G.failState.retry; G.failState = null; if (r) r(); }
    else if (G.anyHit('Escape')) { G.failState = null; G.go('title'); }
  } else if (G.cur) {
    const sims = Math.max(1, G.sim | 0);
    for (let i = 0; i < sims; i++) { if (G.bot) G.bot(dt); if (!G.cur) break; G.cur.update(dt); updateSubs(dt); if (i < sims - 1) pressedSet.clear(); if (G.failState || G.paused) break; }
  }

  // transition

/* scène : cinématique */
G.scenes.cine = {
  enter(o) {
    this.script = G.CINES[o.id]; this.card = 0; this.t = 0; this.laid = false; this.autoT = 0; this.o = o; this.fin = false;
    G.barsTarget = 64; G.grainAmt = 0.09;
    G.audio.mood(this.script.music); G.audio.silenceAll();
    this.startCard();
  },
  startCard() {
    const cd = this.script.cards[this.card];
    this.t = 0; this.laid = false; this.lines = null;
    if (cd.music) G.audio.mood(cd.music);
    if (cd.chapter) G.audio.sfx.boom();
    if (cd.flash) { G.flash = 1; G.flashColor = '#fff'; G.audio.sfx.flash(); }
  },
  layout(c, cd) {
    const f = G.font(31, 500, 'body');
    this.lines = (cd.lines || []).map((l) => (typeof l === 'function' ? l() : l)).map((l) => G.wrap(c, l, 940, f));
  },
  advance() {
    if (this.fin) return;
    if (this.card + 1 >= this.script.cards.length) { this.fin = true; if (this.script.then) this.script.then(); else G.next(); return; }
    this.card++; this.startCard();
  },
  update(dt) {
    const cd = this.script.cards[this.card];
    this.t += dt; if (this.fin) return;
    const nLines = cd.lines ? cd.lines.length : 0;
    const revealed = cd.chapter ? this.t > 2 : this.t > nLines * 2.3 + 0.6;
    if (cd.chapter) { if (this.t > 4.8 || (this.t > 1.2 && G.confirm())) this.advance(); }
    else if (G.confirm()) { if (!revealed) this.t = nLines * 2.3 + 0.7; else if (!cd.end) this.advance(); else { this.fin = true; G.go('title'); } }
    else if (revealed && this.t > nLines * 2.3 + 6.5 && !cd.end) this.advance();
    if (G.hit('KeyS') && !cd.end && !this.fin) { this.fin = true; if (this.script.then) this.script.then(); else G.next(); }
  },
  draw(c) {
    const cd = this.script.cards[this.card], W = G.W, H = G.H, tt = G.time;
    if (cd.chapter) {
      c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
      const a = Math.min(smooth(0.2, 1.4, this.t), 1 - smooth(4.0, 4.8, this.t));
      c.save(); c.globalAlpha = a;
      G.text(c, cd.sub.toUpperCase(), W / 2, 270, { size: 15, align: 'center', ls: 8, color: '#a8926f' });
      G.text(c, cd.big, W / 2, 360, { size: 74, align: 'center', ls: 14, color: '#d9a05b', weight: 500 });
      c.fillStyle = '#d9a05b'; c.fillRect(W / 2 - 60, 388, 120, 1.5);
      G.text(c, cd.title, W / 2, 452, { size: 40, align: 'center', ls: 12, color: '#eadcc4', weight: 500 });
      c.restore(); return;
    }
    // fond + lent zoom
    const z = 1 + Math.min(this.t, 40) * 0.0016;
    c.save(); c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-W / 2, -H / 2);
    G.drawBg(c, tt, cd.bg); c.restore();
    const bg = typeof cd.bg === 'object' ? cd.bg : {};
    if (bg.figs) bg.figs.forEach((f) => A.person(c, f.x, 560, 250, f.k, tt, { rim: [255, 150, 90] }));
    // bandeau sombre
    const g = c.createLinearGradient(0, 260, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.55, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,.88)');
    c.fillStyle = g; c.fillRect(0, 260, W, H - 260);
    if (!this.lines) this.layout(c, cd);
    const lh = 40, gap = 14;
    let total = 0; this.lines.forEach((p) => (total += p.length * lh + gap));
    let y = H - 92 - total + 30;
    const kick = cd.kicker;
    if (cd.big) G.text(c, cd.big, W / 2, 300, { size: 80, align: 'center', ls: 16, color: '#d9a05b', weight: 500, alpha: smooth(0, 3, this.t) });
    if (kick) G.text(c, kick, W / 2, y - 26, { size: 15, align: 'center', ls: 9, color: '#d9a05b', alpha: smooth(0, 1, this.t) });
    this.lines.forEach((p, i) => {
      const a = smooth(i * 2.3 + 0.3, i * 2.3 + 1.7, this.t);
      p.forEach((l, k) => { G.text(c, l, W / 2, y + 28 + k * lh, { size: 31, weight: 500, fam: 'body', align: 'center', color: '#f1e6d2', alpha: a }); });
      y += p.length * lh + gap;
    });
    const n = cd.lines.length;
    if (this.t > n * 2.3 + 1) G.text(c, cd.end ? 'ENTRÉE — RETOUR AU TITRE' : 'ENTRÉE — CONTINUER', W - 70, H - 26, { size: 11, align: 'right', ls: 4, color: '#8a7a62', alpha: 0.5 + 0.5 * Math.sin(tt * 3) });
    else G.text(c, 'S — PASSER', W - 70, H - 26, { size: 11, align: 'right', ls: 4, color: '#6f6250', alpha: 0.7 });
    // fondu d'entrée
    if (this.t < 1) { c.fillStyle = `rgba(0,0,0,${1 - this.t})`; c.fillRect(0, 0, W, H); }
  },
};

  enter(o) {
    this.sc = G.TALKS[o.id]; this.q = this.sc.nodes.slice(); this.bg = this.sc.bg; this.stage = []; this.preg = false;

    this.pop();
  },
  pop() {
    const n = this.q.shift();
    if (!n) { if (!this.fin) { this.fin = true; G.next(); } return; }
    if (n.stage) { this.stage = n.stage; }
    if (n.pregnant !== undefined) this.preg = n.pregnant;
    if (n.bg) this.bg = n.bg;
    if (n.choice) { this.choice = n.choice; this.sel = 0; this.cur = null; return; }
    if (n.who || n.narr) { this.cur = n; this.t = 0; this.typed = 0; return; }
    this.pop();
  },
  update(dt) {
    this.tt += dt; if (this.fin) return;
    if (this.choice) {
      if (G.anyHit('ArrowUp', 'KeyW')) { this.sel = (this.sel + this.choice.length - 1) % this.choice.length; G.audio.sfx.ui(); }
      if (G.anyHit('ArrowDown', 'KeyS')) { this.sel = (this.sel + 1) % this.choice.length; G.audio.sfx.ui(); }
      if (G.mouse.moved) this.choice.forEach((_, i) => { if (Math.abs(G.mouse.x - G.W / 2) < 480 && Math.abs(G.mouse.y - (470 + i * 64)) < 28) this.sel = i; });

        const ch = this.choice[this.sel]; this.choice = null; G.audio.sfx.confirm();
        if (ch.set) Object.assign(G.run, ch.set);
        this.q.unshift(...ch.then); this.pop();
      }
      return;
    }
    if (!this.cur) return;
    this.t += dt; const txt = this.cur.text || this.cur.narr; this.typed = Math.min(txt.length, this.t * 48);

<script>
/* js/scene-thopter.js */
/* Dune : Genesis — Chapitre I : la fuite en ornithoptère dans la tempête */
(function () {
'use strict';
const G = window.G, A = G.art;
const { clamp, smooth, lerp, TAU } = G;
const LEN = 21000, ZM = 0.7;

G.scenes.thopter = {
  enter() {
    this.world = new G.World({ pal: 'day', seed: 5, wind: 0.0, lambda: 330, amp: 1.0, sunTurn: 0.55 });
    this.chk = 0; this.sunDir = this.world.sunAz;
    this.reset(0);
    G.audio.mood('storm'); G.grade = { color: '#c8782c', alpha: 0.12, mode: 'soft-light' };
    G.say('ZQSD / flèches pour piloter · Espace pour pousser les ailes (esquive)', '', 6);
  },
  reset(chk) {
    this.camX = chk * LEN; this.ox = 380; this.oy = 360; this.rvx = 0; this.rvy = 0;
    this.k = 0.3; this.t = 0; this.hull = 4; this.inv = 0; this.dashT = 0; this.dashCd = 0; this.state = 'fly'; this.ct = 0; this.done = false; this.boomed = false;
    this.parts = new G.Particles(300); this.flash = 0; this.msgIdx = 0; this.spawned = chk * LEN;
    this.spires = []; this.enemies = [];
    this.genTo(this.camX + 2600);
    for (let i = 0; i < 3; i++) this.enemies.push({ y: 300 + i * 60, ty: 300, ph: 'move', pt: 1 + i * 1.3, aimY: 0, fireT: 0, hitDone: false, i });
    this.ang = 0; this.crashY = 0; this.spin = 0;
    G.clearSubs(); this.world.warm(this.camX / ZM, 0, G.W, G.H, ZM);
    this.lines = [[0.01, 'Jessica', 'Droit dans la tempête, Paul. Ils n’oseront pas nous suivre.'], [0.12, 'Paul', 'Ils sont derrière nous. Plusieurs appareils.'], [0.26, 'Jessica', 'Reste bas. Le vent sera ton allié.'], [0.42, 'Paul', 'Les pointes rocheuses… je les devine à peine.'], [0.58, 'Jessica', 'Ne pense pas. Écoute les ailes.'], [0.74, 'Paul', 'Les ailes vibrent trop. Elles ne tiendront pas.'], [0.9, 'Jessica', 'Tiens bon, Paul. Encore un peu.']];
    this.lines = this.lines.filter((l) => l[0] * LEN >= this.camX - 1);
  },
  genTo(x1) {
    const r = G.rng(1234 + Math.floor(this.spawned / 1000));
    while (this.spawned < x1) {
      const p = this.spawned / LEN;
      this.spawned += (560 - 240 * p) * (0.7 + r() * 0.8);
      const n = 1 + (r() < 0.35 + p * 0.3 ? 1 : 0);
      for (let k = 0; k < n; k++) this.spires.push({ x: this.spawned + k * 120, y: 70 + r() * 580, r: 34 + r() * 36, seed: Math.floor(r() * 1e6) });
    }
  },
  hurt(src) {
    if (this.inv > 0 || this.dashT > 0 || this.state !== 'fly') return;
    this.hull--; this.inv = 1.4; G.shake = 26; this.flash = 0.6; G.audio.sfx.hit();
    for (let i = 0; i < 14; i++) this.parts.add({ x: this.camX + this.ox, y: this.oy, vx: G.rnd(-120, 80), vy: G.rnd(-100, 100), r0: 3, r1: 9, life: G.rnd(0.5, 1.1), color: '#ffb066', a: 0.8 });
    if (src === 'rock') this.rvx = -150;
    if (this.hull <= 0) {
      this.state = 'dead'; G.audio.thopter(0); G.audio.sfx.explosion(0.8);
      G.fail("L'ORNITHOPTÈRE S'EST BRISÉ", 'Le vent et les Sardaukar ont eu raison de la coque. Le désert n’attend pas.', () => { const c = this.camX / LEN; this.reset(c < 0.33 ? 0 : c < 0.66 ? 0.33 : 0.66); G.audio.thopter(0.7); });
    }
  },
  update(dt) {
    const W = G.W, H = G.H, prog = clamp(this.camX / LEN, 0, 1), k = this.k = 0.3 + 0.7 * smooth(0, 1, prog);
    this.parts.update(dt); this.flash = Math.max(0, this.flash - dt * 1.5);
    if (this.state === 'dead') return;
    this.t += dt;
    if (this.state === 'crash') return this.updateCrash(dt);
    G.audio.thopter(0.55 + this.dashT); G.audio.windBoost(k * 0.7);
    const ax = G.axis();
    this.inv = Math.max(0, this.inv - dt); this.dashT = Math.max(0, this.dashT - dt); this.dashCd = Math.max(0, this.dashCd - dt);
    if (this.dashCd <= 0 && G.anyHit('Space', 'ShiftLeft', 'Mouse0')) { this.dashT = 0.55; this.dashCd = 3.2; G.audio.sfx.dash(); G.shake = 8; }
    const dashing = this.dashT > 0;
    const tvy = ax.y * 330 * (dashing ? 0.35 : 1), tvx = ax.x * 170;
    this.rvx += (tvx - this.rvx) * Math.min(1, dt * 5); this.rvy += (tvy - this.rvy) * Math.min(1, dt * 5);
    const gust = Math.sin(this.t * 0.9 + 1) * 55 + Math.sin(this.t * 2.3) * 30 * k + (G.vnoise(this.t * 1.3, 3, 4) - 0.5) * 150 * k;
    this.oy = clamp(this.oy + (this.rvy + gust) * dt, 64, H - 64); this.ox = clamp(this.ox + this.rvx * dt, 150, 760);
    const speed = (dashing ? 600 : 270 + 40 * k);
    this.camX += speed * dt;
    this.ang += (clamp((this.rvy + gust) / 700, -0.4, 0.4) - this.ang) * Math.min(1, dt * 6);
    this.genTo(this.camX + 2600);
    while (this.spires.length && this.spires[0].x < this.camX - 300) this.spires.shift();
    // collisions rochers
    const px = this.camX + this.ox;
    for (const s of this.spires) if (Math.abs(s.x - px) < s.r + 40 && Math.hypot(s.x - px, s.y - this.oy) < s.r * 0.8 + 18) this.hurt('rock');
    // poursuivants
    const nEn = 1 + (prog > 0.28 ? 1 : 0) + (prog > 0.6 ? 1 : 0);
    this.enemies.forEach((e, idx) => {
      e.active = idx < nEn; if (!e.active) return;
      e.pt -= dt;
      if (e.ph === 'move') {
        e.ty = clamp(this.oy + Math.sin(this.t * 0.6 + idx * 2) * 90, 70, H - 70);
        e.y += clamp(e.ty - e.y, -1, 1) * (110 + 60 * k) * dt;
        if (e.pt <= 0) { e.ph = 'aim'; e.pt = 1.0; e.aimY = e.y; e.hitDone = false; G.audio.sfx.telegraph(); }
      } else if (e.ph === 'aim') {
        if (e.pt > 0.45) { e.aimY = e.y = lerp(e.y, this.oy, dt * 1.6); }
        if (e.pt <= 0) { e.ph = 'fire'; e.pt = 0.16; G.audio.sfx.burst(); G.shake = Math.max(G.shake, 5); }
      } else if (e.ph === 'fire') {
        if (!e.hitDone && Math.abs(this.oy - e.aimY) < 24) { e.hitDone = true; this.hurt('shot'); }
        if (e.pt <= 0) { e.ph = 'move'; e.pt = 1.5 + Math.random() * 1.3 - k * 0.5; }
      }
    });
    // particules : sable soulevé
    if (Math.random() < 0.9) this.parts.add({ x: px - 28, y: this.oy + G.rnd(-4, 4), vx: -speed * 0.5 + G.rnd(-40, 20), vy: G.rnd(-30, 30), r0: 3, r1: G.rnd(10, 20), life: G.rnd(0.6, 1.2), color: '#d8a468', a: 0.28 });
    // dialogues
    while (this.lines.length && prog >= this.lines[0][0]) { const l = this.lines.shift(); G.say(l[2], l[1], 4); }
    // fin
    if (this.camX >= LEN) {
      this.state = 'crash'; this.ct = 0; this.crashStart = { ox: this.ox, oy: this.oy };
      G.say('Le vent arrache les ailes…', '', 3); G.audio.sfx.warn();
    }
  },
  updateCrash(dt) {
    this.ct += dt; this.camX += 220 * Math.max(0.2, 1 - this.ct / 3.2) * dt;
    this.spin += dt * (2 + this.ct * 3); this.ox += 60 * dt; this.oy += Math.sin(this.ct * 3) * 40 * dt;
    G.shake = 6 + this.ct * 8;
    if (this.ct > 3.3 && !this.boomed) { this.boomed = true; G.flash = 1; G.flashColor = '#e9b070'; G.audio.sfx.explosion(1); G.audio.thopter(0); G.audio.windBoost(0.3);
      for (let i = 0; i < 60; i++) this.parts.add({ x: this.camX + this.ox, y: this.oy, vx: G.rnd(-300, 300), vy: G.rnd(-300, 300), r0: 8, r1: 46, life: G.rnd(1, 2.2), color: '#c28850', a: 0.55 }); }
    if (this.ct > 5.2 && !this.done) { this.done = true; G.next(); }
  },
  draw(c) {
    const W = G.W, H = G.H, t = G.time, camX = this.camX;
    this.world.draw(c, camX / ZM, (H / 2) * (1 / ZM - 1) * 0 , W, H, ZM, 1);
    // ombre des nuages de poussière / voile
    for (const s of this.spires) {
      const sx = s.x - camX; if (sx < -200 || sx > W + 300) continue;
      const vis = clamp(1.25 - (sx - 260) / (1050 - 520 * this.k), 0, 1);
      if (vis <= 0.02) continue;
      c.save(); c.globalAlpha = vis; A.spire(c, sx, s.y, s.r, s.seed, this.sunDir); c.restore();
    }
    // traînée
    this.parts.draw(c, camX, 0);
    // poursuivants
    this.enemies.forEach((e, idx) => {
      if (!e.active) return;
      const ex = Math.max(70, this.ox - 270 - idx * 70) + Math.sin(t * 1.3 + idx) * 14;
      if (e.ph === 'aim' || e.ph === 'fire') {
        const on = e.ph === 'fire';
        c.save(); c.globalCompositeOperation = 'lighter';
        if (on) { c.strokeStyle = 'rgba(255,230,190,.95)'; c.lineWidth = 6; c.shadowColor = '#ff9040'; c.shadowBlur = 24; }
        else { const f = Math.sin(t * 40) > 0 ? 0.55 : 0.18; c.strokeStyle = `rgba(255,70,50,${f})`; c.lineWidth = 2; }
        c.beginPath(); c.moveTo(ex + 40, e.aimY); c.lineTo(W + 40, e.aimY); c.stroke(); c.restore();
      }
      A.thopter(c, ex, e.y, 0.05 * Math.sin(t * 2 + idx), t + idx, { style: 'harkonnen', s: 1.0, light: '#ff4a2a', sx: 20, sy: 30 });
    });
    // joueur
    if (this.state !== 'dead') {
      const blink = this.inv > 0 && Math.floor(t * 18) % 2 === 0;
      if (!blink) {
        if (this.state === 'crash') {
          const k = clamp(this.ct / 3.3, 0, 1);
          A.thopter(c, this.ox, this.oy + k * 120, this.spin, t, { style: 'atreides', s: 1.15 - k * 0.5, sx: 20 + k * 60, sy: 26 + k * 40 });
        } else {
          if (this.dashT > 0) { c.save(); c.globalCompositeOperation = 'lighter'; for (let i = 1; i < 6; i++) { c.globalAlpha = 0.14 * (6 - i) / 6; A.thopter(c, this.ox - i * 26, this.oy, this.ang, t - i * 0.01, { s: 1.15, shadow: false }); } c.restore(); }
          A.thopter(c, this.ox, this.oy, this.ang, t, { style: 'atreides', s: 1.15, light: '#ffcf8a', sx: 18, sy: 28 });
        }
      }
    }

<script>
/* js/scene-trek.js */
/* Dune : Genesis — Chapitre II (Le Grand Erg) et VIII (La Marche aveugle) :
   traverser le désert sans rythme, de roche en roche. */
(function () {
'use strict';
const G = window.G, A = G.art;
const { clamp, smooth, lerp, TAU } = G;

const CFG = {
  erg: {
    pal: 'day', seed: 21, wind: 0.25, lambda: 340, amp: 1.0, blind: false,
    islands: [
      { x: 0, y: 0, r: 160 }, { x: 800, y: -260, r: 140 }, { x: 1650, y: 90, r: 165 }, { x: 2060, y: -150, r: 62 }, { x: 2290, y: 60, r: 66 },
      { x: 2650, y: -400, r: 145 }, { x: 3500, y: -60, r: 240 },
    ],
    path: [0, 1, 2, 5, 6], // îles principales (les petites 3 et 4 sont des abris)
    patrols: [{ cx: 2150, cy: -90, ax: 330, ay: 170, w: 0.5, ph: 0 }, { cx: 2150, cy: -90, ax: 260, ay: 230, w: 0.37, ph: 2.1 }],
    waterDrain: 0.42, music: 'trek', attRate: 1.0,
    grade: { color: '#d27a2c', alpha: 0.1, mode: 'soft-light' },
  },
  blind: {
    pal: 'sonar', seed: 77, wind: 0.1, lambda: 320, amp: 1.1, blind: true,
    islands: [
      { x: 0, y: 0, r: 190 }, { x: 800, y: 130, r: 150 }, { x: 1620, y: -190, r: 160 }, { x: 2450, y: 150, r: 155 },
      { x: 3280, y: -140, r: 165 }, { x: 4100, y: 100, r: 160 }, { x: 4950, y: -40, r: 280 },
    ],
    path: [0, 1, 2, 3, 4, 5, 6], patrols: [], waterDrain: 0, music: 'blind', attRate: 1.15,
    grade: { color: '#2a4a90', alpha: 0.1, mode: 'soft-light' },
  },
};

const STRIDE = 32, WALK = 150, SLOW = 78, SPRINT = 236;

G.scenes.trek = {
  enter(o) {
    this.cfg = CFG[o.id || 'erg']; const cfg = this.cfg;
    this.world = new G.World({ pal: cfg.pal, seed: cfg.seed, wind: cfg.wind, lambda: cfg.lambda, amp: cfg.amp, islands: cfg.islands, sunAlt: cfg.blind ? 0.55 : 0.6 });
    this.blind = cfg.blind;
    if (this.blind) { this.buf = document.createElement('canvas'); this.buf.width = 640; this.buf.height = 360; this.mask = document.createElement('canvas'); this.mask.width = 640; this.mask.height = 360; }
    this.chk = 0; this.water = 100; this.spice = 0; this.left = false; this.vi = 0; this.lowMsg = false;
    this.items = []; this.genItems();
    this.respawn(true);
    G.audio.mood(cfg.music); G.audio.silenceAll(); G.grade = cfg.grade; G.grainAmt = this.blind ? 0.1 : 0.07;
    if (this.blind) { G.say('Les yeux ne servent plus. Écoute le sable : chaque pas, chaque appel l’éclaire un instant.', '', 6); G.say('Espace : sonder le sol · Maj : marche lente · Marche sans rythme.', '', 6); }
    else { G.say('Dame Jessica : « On ne marche jamais en cadence dans le désert. Le ver entend tout. »', '', 6); G.say('ZQSD / flèches · Maj : marche lente · Espace : sprint · Alterne les allures pour briser le rythme.', '', 7); }
  },
  genItems() {
    const r = G.rng(this.cfg.seed * 3 + 1), isl = this.cfg.islands, P = this.cfg.path;
    for (let k = 0; k < P.length - 1; k++) {
      const a = isl[P[k]], b = isl[P[k + 1]];
      // une réserve d'eau au bord de l'île d'arrivée, de l'épice sur le trajet
      if (!this.blind) { const ang = Math.atan2(a.y - b.y, a.x - b.x); this.items.push({ x: b.x + Math.cos(ang) * b.r * 0.35, y: b.y + Math.sin(ang) * b.r * 0.35, t: 'water', on: true }); }
      for (let i = 0; i < 3; i++) {
        const f = 0.25 + i * 0.25 + r() * 0.08, jx = (r() - 0.5) * 160, jy = (r() - 0.5) * 160;
        this.items.push({ x: lerp(a.x, b.x, f) + jx, y: lerp(a.y, b.y, f) + jy, t: 'spice', on: true });
      }
    }
  },
  respawn(first) {
    const a = this.cfg.islands[this.cfg.path[this.chk]];
    this.px = a.x + (first ? 0 : 20); this.py = a.y + (first ? 0 : 20); this.ang = 0; this.walkPh = 0; this.stepAcc = 0;
    this.stepTimes = []; this.att = 0; this.reg = 0; this.t = 0; this.worm = null; this.det = 0; this.state = 'play'; this.endT = 0;
    this.hist = []; this.prints = []; this.rings = []; this.pings = []; this.fremen = null;
    this.camX = this.px - G.W / 2; this.camY = this.py - G.H / 2; this.tremorT = 0; this.spawnedMsg = false; this.warnMsg = 0;
    this.pingCd = 0; this.lastTarget = -1; this.parts = new G.Particles(200);
    if (!first) this.water = Math.max(this.water, 55);
    this.world.warm(this.camX, this.camY, G.W, G.H, 1);
  },
  safe(x, y) { return this.world.rock(x, y) > 0.45; },
  /* --- pas et rythme --- */
  onStep() {
    const onSand = !this.safe(this.px, this.py), t = this.t;
    if (onSand) {
      this.stepTimes.push(t); if (this.stepTimes.length > 9) this.stepTimes.shift();
      G.audio.sfx.step(this.blind ? 0.8 : 1);
      this.prints.push({ x: this.px, y: this.py, a: this.ang, t });
      if (this.prints.length > 90) this.prints.shift();
    } else G.audio.sfx.stepRock(0.9);

    const a = this.stepTimes, n = a.length;
    if (n >= 4 && onSand) {
      const iv = []; for (let i = Math.max(1, n - 5); i < n; i++) iv.push(a[i] - a[i - 1]);
      const m = iv.reduce((s, v) => s + v, 0) / iv.length;
      const dev = iv.reduce((s, v) => s + Math.abs(v - m), 0) / iv.length / m;
      this.reg = clamp(1 - (dev - 0.05) / 0.3, 0, 1);
    } else this.reg = 0;

      this.rings.push({ x: this.px, y: this.py, t: 0, reg: this.reg });
      if (this.blind) this.pings.push({ x: this.px, y: this.py, t: 0, life: 2.2, R: 190 });
    }
  },
  nextTarget() { for (let k = this.chk + 1; k < this.cfg.path.length; k++) return k; return this.cfg.path.length - 1; },
  update(dt) {
    const cfg = this.cfg, W = G.W, H = G.H;
    this.t += dt; this.parts.update(dt);
    for (const r of this.rings) r.t += dt; this.rings = this.rings.filter((r) => r.t < 1.6);
    for (const p of this.pings) p.t += dt; this.pings = this.pings.filter((p) => p.t < p.life);
    if (this.state === 'arrive') return this.updateArrive(dt);
    // déplacement
    const ax = G.axis(), slow = G.key('ShiftLeft') || G.key('ShiftRight'), sprint = G.key('Space') && !this.blind;
    let moving = ax.len > 0.12;
    const spd = (sprint ? SPRINT : slow ? SLOW : WALK) * (this.water <= 0 ? 0.6 : 1);
    if (moving) {
      this.ang = Math.atan2(ax.y, ax.x); const d = spd * dt * Math.min(1, ax.len * 1.2);
      this.px += Math.cos(this.ang) * d; this.py += Math.sin(this.ang) * d;
      this.walkPh += d * 0.2; this.stepAcc += d;
      while (this.stepAcc >= STRIDE) { this.stepAcc -= STRIDE; this.onStep(); }
    }
    if (this.stepTimes.length && this.t - this.stepTimes[this.stepTimes.length - 1] > 1.5) { this.stepTimes.length = 0; this.reg = 0; }
    const onRock = this.safe(this.px, this.py);
    // sondage (marche aveugle)
    this.pingCd = Math.max(0, this.pingCd - dt);
    if (this.blind && G.anyHit('Space', 'Mouse0') && this.pingCd <= 0) {
      this.pingCd = 1.6; this.pings.push({ x: this.px, y: this.py, t: 0, life: 3.6, R: 620 }); G.audio.sfx.ping(0.8);
      if (!onRock) this.att = Math.min(1.1, this.att + 0.14);

    const mult = sprint ? 1.5 : slow ? 0.65 : 1;
    if (!onRock && moving) this.att += ((this.reg * 0.3 * mult * cfg.attRate) - 0.1) * dt;
    else this.att -= (onRock ? 0.3 : 0.07) * dt;
    this.att = clamp(this.att, 0, 1.15);
    if (this.att > 0.5 && !this.worm) {
      this.tremorT -= dt; if (this.tremorT <= 0) { this.tremorT = 1.7; G.audio.sfx.tremor(); G.shake = Math.max(G.shake, 5 + this.att * 8); }
      if (this.warnMsg < 1) { this.warnMsg = 1; G.say('Le sable vibre. Brise ton rythme !', this.blind ? 'Alia' : 'Jessica', 3); }
    }
    if (this.att < 0.3) this.warnMsg = 0;
    if (this.att >= 1 && !this.worm && !onRock) this.spawnWorm();
    this.updateWorm(dt, onRock);
    // eau
    if (cfg.waterDrain) {
      this.water -= (cfg.waterDrain * (sprint ? 5.5 : moving ? 1 : 0.35) * (this.worm ? 1 : 1)) * dt;
      this.water = clamp(this.water, 0, 100);
      if (this.water < 25 && !this.lowMsg) { this.lowMsg = true; G.say('Ta combinaison est presque à sec. Trouve de l’eau.', 'Jessica', 3); }
      if (this.water > 40) this.lowMsg = false;
      if (this.water <= 0 && this.state === 'play') { this.state = 'dead'; this.die('DÉSHYDRATATION', 'Le désert prend toujours son eau. Les Fremen disent : l’eau est la vie, le reste n’est que sable.'); }
    }
    // objets
    for (const it of this.items) if (it.on && Math.hypot(it.x - this.px, it.y - this.py) < 34) {
      it.on = false;
      if (it.t === 'water') { this.water = clamp(this.water + 32, 0, 100); G.audio.sfx.water(); G.say('Réserve d’eau fremen. +32 %', '', 2); }
      else { this.spice++; G.run.spice++; G.audio.sfx.pickup(); this.parts.add({ x: it.x, y: it.y, vx: 0, vy: -30, r0: 6, r1: 26, life: 0.7, color: '#ffb25c', a: 0.5 }); }
    }
    // patrouilles
    if (cfg.patrols.length) {
      let seen = false;
      for (const p of cfg.patrols) {
        const pos = this.patrolPos(p, this.t);
        if (!onRock && Math.hypot(pos.lx - this.px, pos.ly - this.py) < 150) seen = true;
      }
      this.det = clamp(this.det + (seen ? 0.75 : -0.6) * dt, 0, 1.05);
      if (this.det >= 1 && this.state === 'play') { this.state = 'dead'; G.audio.sfx.burst(); this.die('REPÉRÉ', 'Un ornithoptère Harkonnen vous a trouvés. La roche est votre seul abri contre leurs projecteurs.'); }
    }
    // progression
    const isl = cfg.islands;
    for (let k = this.chk + 1; k < cfg.path.length; k++) {
      const I = isl[cfg.path[k]];
      if (Math.hypot(I.x - this.px, I.y - this.py) < I.r * 0.7) {
        this.chk = k; G.audio.sfx.confirm();
        if (k === cfg.path.length - 1) { this.arrive(); }
        else G.say(this.blind ? 'Une pierre froide sous tes pieds. Tu respires.' : 'Un refuge. Reprends ton souffle avant le prochain trajet.', '', 3);
      }
    }
    // caméra
    const tx = this.px + Math.cos(this.ang) * 40 - W / 2, ty = this.py + Math.sin(this.ang) * 40 - H / 2;
    this.camX += (tx - this.camX) * Math.min(1, dt * 3); this.camY += (ty - this.camY) * Math.min(1, dt * 3);
    this.hist.push({ x: this.px, y: this.py, t: this.t }); while (this.hist.length > 120) this.hist.shift();
    G.audio.wormLevel(this.worm ? clamp(1 - (Math.hypot(this.worm.x - this.px, this.worm.y - this.py) - 100) / 800, 0, 1) * 0.9 : this.att > 0.5 ? (this.att - 0.5) * 0.5 : 0);
    if (this.blind && Math.random() < dt * 0.1 && this.t > 6) G.audio.sfx.heart();
    // voix du fond (marche aveugle)
    if (this.blind) this.updateVoices();
  },
  updateVoices() {
    const V = [[8, 'Chani', 'Usul… regarde-moi. Même sans yeux.'], [30, 'Alia', 'Le futur est un mur, Paul. Il n’y a plus de porte.'], [52, 'Stilgar', 'Le désert te connaît, Muad’Dib.'], [80, 'Chani', 'Les enfants auront nos yeux.'], [110, 'Alia', 'Marche. Je veillerai sur eux.']];
    this.vi = this.vi || 0;
    if (this.vi < V.length && this.t > V[this.vi][0]) { const v = V[this.vi++]; G.say(v[2], v[1], 4); G.audio.sfx.vision(); }
  },
  patrolPos(p, t) {
    const x = p.cx + Math.cos(t * p.w + p.ph) * p.ax, y = p.cy + Math.sin(t * p.w * 1.7 + p.ph) * p.ay;
    const vx = -Math.sin(t * p.w + p.ph) * p.ax * p.w, vy = Math.cos(t * p.w * 1.7 + p.ph) * p.ay * p.w * 1.7, a = Math.atan2(vy, vx);
    return { x, y, a, lx: x + Math.cos(a) * 170, ly: y + Math.sin(a) * 170 };
  },
  spawnWorm() {
    const a = Math.random() * TAU;
    this.worm = { x: this.px + Math.cos(a) * 760, y: this.py + Math.sin(a) * 760, ang: a + Math.PI, speed: 170, r: 58, pts: [], state: 'approach', timer: 0, emerge: 0, isl: null, open: 0 };
    this.worm.pts.push({ x: this.worm.x, y: this.worm.y }); this.worm.last = { x: this.worm.x, y: this.worm.y };
    G.say('Shai-Hulud ! Gagne la roche !', this.blind ? 'Alia' : 'Jessica', 3); G.audio.sfx.roar(); G.shake = 18;
  },
  updateWorm(dt, onRock) {
    const w = this.worm; if (!w) return;
    const d = Math.hypot(w.x - this.px, w.y - this.py);
    if (w.state === 'approach') {
      const want = Math.atan2(this.py - w.y, this.px - w.x);
      w.ang += clamp(G.angDiff(w.ang, want), -2.4 * dt, 2.4 * dt);
      w.speed = Math.min(235, w.speed + 24 * dt);
      w.x += Math.cos(w.ang) * w.speed * dt; w.y += Math.sin(w.ang) * w.speed * dt;
      w.emerge = smooth(560, 230, d);
      // bloqué par la roche -> tourne autour
      if (this.world.rock(w.x + Math.cos(w.ang) * 60, w.y + Math.sin(w.ang) * 60) > 0.3 || (onRock && d < 330)) {
        let best = null, bd = 1e9; for (const i of this.cfg.islands) { const dd = Math.hypot(i.x - w.x, i.y - w.y); if (dd < bd) { bd = dd; best = i; } }
        w.state = 'circle'; w.isl = best; w.timer = 0; w.circAng = Math.atan2(w.y - best.y, w.x - best.x);
      }
      if (d < 74 && !onRock) { this.state = 'dead'; G.audio.sfx.roar(); G.flash = 0.8; G.flashColor = '#1a0a05'; this.die('SHAI-HULUD', 'Le sable s’ouvre sous vos pas. Dans le désert, il faut marcher sans rythme.'); }
    } else if (w.state === 'circle') {
      w.timer += dt; const I = w.isl, R = I.r * 1.18 + 120;
      w.circAng += (230 / R) * dt * (Math.random() < 0 ? -1 : 1);
      const tx = I.x + Math.cos(w.circAng) * R, ty = I.y + Math.sin(w.circAng) * R;
      const prevx = w.x, prevy = w.y; w.x += (tx - w.x) * Math.min(1, dt * 3); w.y += (ty - w.y) * Math.min(1, dt * 3);
      w.ang = Math.atan2(w.y - prevy, w.x - prevx); w.emerge = Math.max(0.5, w.emerge - dt * 0.1);
      if (w.timer > 6) { w.state = 'leave'; w.timer = 0; this.att = 0.2; G.say('Il s’éloigne. Pour l’instant.', '', 2.5); }
    } else {
      w.timer += dt; w.speed = 200; w.x += Math.cos(w.ang) * w.speed * dt; w.y += Math.sin(w.ang) * w.speed * dt; w.emerge = Math.max(0, w.emerge - dt * 0.6);

    if (Math.random() < 0.9) this.parts.add({ x: w.x + G.rnd(-40, 40), y: w.y + G.rnd(-40, 40), vx: G.rnd(-30, 30), vy: G.rnd(-30, 30), r0: 12, r1: 60, life: G.rnd(0.8, 1.8), color: this.cfg.blind ? '#6f86a8' : '#c88f58', a: 0.3 });
  },
  die(title, text) {

  },
  arrive() {

      this.fremen = [0, 1, 2, 3, 4].map((i) => ({ x: I.x + Math.cos(i * 1.4 + 3) * (I.r * 0.8), y: I.y + Math.sin(i * 1.4 + 3) * (I.r * 0.7), t: i * 0.9, who: i }));
      G.say('Stilgar : « Qui marche ainsi, sans cadence, comme les enfants d’Arrakis ? »', '', 4.2);
      G.say('Jessica : « Nous cherchons refuge, et un peu d’eau. »', '', 3.5);
      G.say('Chani : « Ils ont des yeux d’Ibad. Ils ont bu l’épice. »', '', 3.5);
    } else {
      G.say('Paul : « Le sable se souvient de moi. »', '', 4);
      G.say('Alia : « Je te vois, mon frère. Va. »', '', 3.5);
      G.say('Paul : « Dis aux enfants que je n’ai pas eu peur. »', '', 4);
    }
  },
  updateArrive(dt) {
    this.endT += dt; G.audio.wormLevel(0);
    for (const f of this.fremen || []) f.t += dt;
    if (this.endT > 13 && !this.left) { this.left = true; G.next(); }
  },
  /* --- dessin --- */
  drawWorldLayer(c, camX, camY) {
    const W = G.W, H = G.H, t = G.time, cfg = this.cfg;
    this.world.draw(c, camX, camY, W, H, 1, 3);
    // empreintes
    for (const p of this.prints) { const a = clamp(1 - (this.t - p.t) / 22, 0, 1) * 0.35; if (a <= 0) continue; c.fillStyle = `rgba(30,10,0,${a})`; c.save(); c.translate(p.x - camX, p.y - camY); c.rotate(p.a); c.beginPath(); c.ellipse(0, 0, 6, 3, 0, 0, TAU); c.fill(); c.restore(); }

    for (const it of this.items) {
      if (!it.on) continue; const x = it.x - camX, y = it.y - camY; if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
      const pulse = 0.6 + 0.4 * Math.sin(t * 3 + it.x);

<script>
/* js/scene-ride.js */
/* Dune : Genesis — Chapitres III & V : chevaucher Shai-Hulud */
(function () {
'use strict';
const G = window.G, A = G.art;
const { clamp, smooth, lerp, TAU } = G;

const RCFG = {
  harvest: { pal: 'day', seed: 33, wind: 0.15, lambda: 420, amp: 1.0, targets: 3, thop: 2, turrets: 0, allies: 0, music: 'ride', mount: true, label: 'MOISSONNEUSES', name: 'une moissonneuse' },
  arrakeen: { pal: 'dusk', seed: 51, wind: 0.5, lambda: 400, amp: 1.1, targets: 5, thop: 4, turrets: 6, allies: 3, music: 'battle', mount: false, label: 'TRANSPORTS IMPÉRIAUX', name: 'un transport impérial' },
};

/* ver : chaîne de points suiveurs */
function makeWorm(x, y, ang, r, n) {
  const sp = r * 0.36, w = { x, y, ang, speed: 240, r, n, sp, av: 0, pts: [] };
  for (let i = 0; i < n; i++) w.pts.push({ x: x - Math.cos(ang) * i * sp, y: y - Math.sin(ang) * i * sp });
  return w;
}
function stepWorm(w, dt) {
  w.x += Math.cos(w.ang) * w.speed * dt; w.y += Math.sin(w.ang) * w.speed * dt;
  const p = w.pts; p[0].x = w.x; p[0].y = w.y;
  for (let i = 1; i < p.length; i++) {
    const dx = p[i].x - p[i - 1].x, dy = p[i].y - p[i - 1].y, d = Math.hypot(dx, dy) || 1;
    if (d > w.sp) { p[i].x = p[i - 1].x + dx * w.sp / d; p[i].y = p[i - 1].y + dy * w.sp / d; }
  }
}

G.scenes.ride = {
  enter(o) {
    this.cfg = RCFG[o.id || 'harvest']; this.id = o.id || 'harvest';
    this.world = new G.World({ pal: this.cfg.pal, seed: this.cfg.seed, wind: this.cfg.wind, lambda: this.cfg.lambda, amp: this.cfg.amp });
    this.destroyed = 0; this.setup();
    G.audio.mood(this.cfg.music); G.audio.silenceAll(); G.grade = this.cfg.pal === 'day' ? { color: '#d27a2c', alpha: 0.12, mode: 'soft-light' } : { color: '#c04a28', alpha: 0.16, mode: 'soft-light' };
  },
  setup() {
    const cfg = this.cfg, R = G.rng(cfg.seed + 9);
    this.t = 0; this.hp = 5; this.inv = 0; this.dive = 0; this.diveCd = 0; this.win = 0; this.left = false; this.canHook = false; this.near = null;
    this.parts = new G.Particles(500); this.smoke = new G.Particles(300);
    this.bullets = []; this.thops = []; this.thopCd = 4; this.blasts = [];
    this.harv = []; this.landers = []; this.turrets = []; this.carry = []; this.allies = [];
    this.px = 0; this.py = 0; this.pang = 0; this.walkPh = 0; this.thump = null;
    if (cfg.mount) {
      this.state = 'thump'; this.worm = null;
      G.say('Stilgar : « Plante le marteleur, Usul. Le Faiseur viendra à toi. »', '', 5);
      G.say('E : planter le marteleur · puis, quand le ver passe, Espace pour t’accrocher à son flanc.', '', 6);
      const T = [[1500, -260], [2600, 700], [1300, 1800]];
      T.forEach((p, i) => this.harv.push({ x: p[0], y: p[1], ang: 0.5 + i * 0.4, st: 'work', at: 0, carry: null, i }));
    } else {
      this.state = 'ride'; this.worm = makeWorm(0, 0, 0, 62, 42); this.worm.speed = 260; this.px = 0; this.py = 0;
      const pos = [[1300, -300], [2200, 400], [3100, -250], [3900, 450], [4700, -100]];
      pos.forEach((p, i) => this.landers.push({ x: p[0], y: p[1], ang: (R() - 0.5) * 0.8, alive: true, alert: false }));
      for (let i = 0; i < cfg.turrets; i++) { const l = this.landers[i % this.landers.length]; this.turrets.push({ x: l.x + (R() - 0.5) * 700, y: l.y + (R() - 0.5) * 600, alive: true, cd: 2 + R() * 3, st: 'idle', tt: 0, tx: 0, ty: 0 }); }
      for (let i = 0; i < cfg.allies; i++) { const a = makeWorm(-300 - i * 120, (i - 1) * 260, 0, 54, 38); a.speed = 235; a.mode = 'follow'; a.off = (i - 1) * 260; this.allies.push(a); }
      G.say('Paul : « Fedaykin ! Les Atréides vous regardent ! »', '', 4);
      G.say('Chevauche Shai-Hulud droit sur les transports impériaux. Plonge (Espace) sous les tirs.', '', 6);
      this.rubble = [];
      const wr = G.rng(5); for (let i = 0; i < 18; i++) { const y = -1000 + i * 118; if (Math.abs(y) < 170) continue; this.rubble.push({ x: -420 + wr() * 70, y, r: 62 + wr() * 34, seed: Math.floor(wr() * 1e6) }); }
    }

    this.world.warm(this.camX, this.camY, G.W, G.H, 1);
  },
  riderPos() { const w = this.worm; return w ? w.pts[Math.min(3, w.pts.length - 1)] : { x: this.px, y: this.py }; },
  /* ---------- mise à jour ---------- */
  update(dt) {
    this.t += dt; this.parts.update(dt); this.smoke.update(dt);
    this.inv = Math.max(0, this.inv - dt); this.diveCd = Math.max(0, this.diveCd - dt);
    if (this.state === 'thump') this.updateThump(dt);
    else if (this.state === 'mount') this.updateMount(dt);
    else this.updateRide(dt);
    // caméra
    let fx, fy;
    if (this.state === 'thump') { fx = this.px; fy = this.py; }
    else if (this.state === 'mount') { const dx = this.worm.x - this.px, dy = this.worm.y - this.py, dd = Math.hypot(dx, dy) || 1, kk = Math.min(1, 420 / dd) * 0.5; fx = this.px + dx * kk; fy = this.py + dy * kk; }

  },
  updateThump(dt) {
    const ax = G.axis();

      if (ax.len > 0.1) { this.pang = Math.atan2(ax.y, ax.x); this.px += ax.x * 120 * dt; this.py += ax.y * 120 * dt; this.walkPh += 0.4; }
      if (G.hit('KeyE') || G.hit('Mouse0')) {
        this.thump = { x: this.px, y: this.py, t: 0 }; G.audio.sfx.confirm(); G.say('Le marteleur bat. Quelque chose, très loin, répond.', '', 4);
        const a = -0.5 + Math.random() * 0.6 + Math.PI; // vient de l'ouest
        this.worm = makeWorm(this.px + Math.cos(a) * 1300, this.py + Math.sin(a) * 1300, a + Math.PI, 62, 42); this.worm.speed = 200; this.state = 'mount'; this.mt = 0; G.audio.sfx.roar();
      }
    }
  },
  updateMount(dt) {
    const w = this.worm, th = this.thump; this.mt += dt; th.t += dt;
    if (Math.floor(th.t * 1.2) !== Math.floor((th.t - dt) * 1.2)) { G.audio.sfx.tremor(); G.shake = Math.max(G.shake, 7); }
    const ax = G.axis();
    if (ax.len > 0.1) { this.pang = Math.atan2(ax.y, ax.x); this.px += ax.x * 130 * dt; this.py += ax.y * 130 * dt; this.walkPh += 0.4; }
    // le ver vise le marteleur, puis continue tout droit
    const d = Math.hypot(th.x - w.x, th.y - w.y);
    if (!w.passed) { const want = Math.atan2(th.y - w.y, th.x - w.x); w.ang += clamp(G.angDiff(w.ang, want), -1.6 * dt, 1.6 * dt); if (d < 130) w.passed = true; }

      G.say('Le Faiseur revient. Place-toi près de son flanc.', '', 3.5);
    }
  },
  mountNow() {
    const w = this.worm; this.thump = null; this.state = 'ride'; w.speed = 245; w.passed = true; this.flashT = 1; G.audio.sfx.surface(); G.shake = 20; G.flash = 0.5; G.flashColor = '#f6dcae';
    G.say('Paul : « Les crochets… maintenant ! »', '', 3); G.say('Chani : « Tu le tiens, Usul. Il est à toi. »', '', 4);
    G.say('Guide Shai-Hulud droit sur les moissonneuses. Plonge (Espace) pour esquiver les tirs.', '', 6);
  },
  dust(w, dt, k) {
    for (let i = 0; i < w.pts.length; i += 2) if (Math.random() < 5 * dt * k) {
      const p = w.pts[i], a = Math.random() * TAU;
      this.smoke.add({ x: p.x + Math.cos(a) * w.r * 0.7, y: p.y + Math.sin(a) * w.r * 0.7, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, r0: 14, r1: 54 + Math.random() * 30, life: 1 + Math.random(), color: this.cfg.pal === 'dusk' ? '#a86a4c' : '#d09a62', a: 0.28 });
    }

  [0.55, 'Chani… près d’une eau qui ne devrait pas exister. Pourquoi pleure-t-elle ?'],
  [0.75, 'Le feu sur toutes les mers. Des mondes entiers, réduits au silence.'],
  [0.95, 'Et un chemin si étroit qu’il tient dans un seul souffle. Je le vois.'],

G.scenes.vision = {
  enter() {
    this.t = 0; this.scroll = 0; this.px = 380; this.py = 360; this.vx = 0; this.vy = 0; this.clarity = 0; this.vi = 0;
    this.hits = []; this.hitCd = 0; this.visT = 0; this.visK = -1; this.done = 0; this.trail = []; this.spawnT = 2; this.shakeT = 0;
    this.parts = new G.Particles(300); this.left = false;
    G.audio.mood('vision'); G.audio.silenceAll(); G.grade = { color: '#1a50c8', alpha: 0.14, mode: 'soft-light' }; G.grainAmt = 0.09;
    G.say('Paul est entre deux rives. Suis le fil doré du temps — évite les gouffres.', '', 6);
    G.say('ZQSD / flèches : guider ton esprit', '', 4);
  },
  thread(u) {
    return 360 + 150 * Math.sin(u * 0.0036) + 90 * Math.sin(u * 0.0083 + 1.3) + 38 * Math.sin(u * 0.019 + 0.5) * (0.5 + 0.5 * Math.sin(u * 0.0021));
  },
  update(dt) {
    this.t += dt; this.parts.update(dt);
    if (this.done) { this.done += dt; if (this.done > 4.2 && !this.left) { this.left = true; G.next(); } return; }
    const ax = G.axis();
    this.vx += ax.x * 1100 * dt; this.vy += ax.y * 1100 * dt;
    const damp = Math.pow(0.04, dt); this.vx *= damp; this.vy *= damp;
    const sp = Math.hypot(this.vx, this.vy); if (sp > 360) { this.vx *= 360 / sp; this.vy *= 360 / sp; }
    this.px = clamp(this.px + this.vx * dt, 200, 620); this.py = clamp(this.py + this.vy * dt, 50, G.H - 50);
    const v = 200 + 30 * this.clarity; this.scroll += v * dt;
    // fil
    const ty = this.thread(this.px + this.scroll), off = Math.abs(this.py - ty);
    const on = off < 56; this.on = on;
    this.clarity = clamp(this.clarity + (on ? 0.030 * (1 - off / 120) : -0.05) * dt, 0, 1);
    G.audio.windBoost(0);
    // gouffres
    this.spawnT -= dt; this.hitCd = Math.max(0, this.hitCd - dt);
    if (this.spawnT <= 0) { this.spawnT = 1.5 + Math.random() * 1.3 - this.clarity * 0.5; const y = this.thread(G.W + this.scroll + 100) + G.rnd(-150, 150); this.hits.push({ x: G.W + 120, y: clamp(y, 60, G.H - 60), r: G.rnd(36, 66), s: Math.random() * 100 }); }
    for (const h of this.hits) { h.x -= (v * 1.25) * dt; if (this.hitCd <= 0 && Math.hypot(h.x - this.px, h.y - this.py) < h.r + 6) { this.hitCd = 1; this.clarity = Math.max(0, this.clarity - 0.1); G.shake = 14; G.audio.sfx.hit(); this.flashBad = 0.6; } }
    this.hits = this.hits.filter((h) => h.x > -150);
    this.flashBad = Math.max(0, (this.flashBad || 0) - dt * 1.6);
    // trace
    this.trail.push({ x: this.px, y: this.py, t: this.t }); while (this.trail.length > 60) this.trail.shift();
    if (Math.random() < 0.8) this.parts.add({ x: this.px, y: this.py, vx: G.rnd(-60, -20), vy: G.rnd(-20, 20), r0: 3, r1: 0.5, life: 1, color: on ? '#ffd28a' : '#7ab4ff', a: 0.8 });
    // visions
    if (this.vi < VISIONS.length && this.clarity >= VISIONS[this.vi][0]) { G.say(VISIONS[this.vi][1], 'Paul', 6); this.visK = this.vi; this.visT = 6.5; G.audio.sfx.vision(); this.vi++; }
    this.visT = Math.max(0, this.visT - dt);
    if (this.clarity >= 1 && !this.done) { this.done = 0.001; G.flash = 1; G.flashColor = '#cfe4ff'; G.audio.sfx.boom(); G.say('Paul : « Je vois. Je vois tout. »', '', 4); }
  },
  drawVision(c, k, a) {
    const W = G.W, H = G.H, t = G.time;
    c.save(); c.globalAlpha = a * 0.7;
    if (k === 0) {
      c.fillStyle = 'rgba(8,24,14,.9)';
      for (let row = 0; row < 5; row++) for (let i = 0; i < 40; i++) { const x = 60 + i * 30 + (row % 2) * 15 + Math.sin(t * 2 + i) * 1.5, y = 330 + row * 38, h = 34 + row * 6; c.fillRect(x - 4, y - h, 8, h); c.beginPath(); c.arc(x, y - h - 4, 5, 0, TAU); c.fill(); }
      c.fillStyle = 'rgba(40,160,90,.8)'; for (let i = 0; i < 8; i++) c.fillRect(120 + i * 150, 140 + Math.sin(t * 1.5 + i) * 6, 5, 190), c.fillRect(125 + i * 150, 140, 56 + Math.sin(t * 3 + i) * 6, 80);
    } else if (k === 1) {
      A.person(c, W * 0.7, 560, 220, 'alia', t, { rim: [140, 190, 255], lit: 1 });
      const g = c.createRadialGradient(W * 0.7, 420, 0, W * 0.7, 420, 160); g.addColorStop(0, 'rgba(120,180,255,.5)'); g.addColorStop(1, 'rgba(120,180,255,0)'); c.fillStyle = g; c.fillRect(W * 0.7 - 170, 250, 340, 340);
    } else if (k === 2) {
      A.person(c, W * 0.68, 580, 360, 'chani', t, { rim: [150, 200, 255], lit: 1 });
      c.strokeStyle = 'rgba(150,200,255,.5)'; c.lineWidth = 2; for (let i = 0; i < 6; i++) { c.beginPath(); c.ellipse(W * 0.68, 590, 80 + i * 40 + Math.sin(t * 2 + i) * 6, 14 + i * 6, 0, 0, TAU); c.stroke(); }
    } else if (k === 3) {
      for (let i = 0; i < 12; i++) { const x = i * 120 + Math.sin(t + i) * 10, g = c.createRadialGradient(x, H, 0, x, H, 260 + (i % 3) * 60); g.addColorStop(0, 'rgba(255,150,50,.7)'); g.addColorStop(1, 'rgba(255,90,20,0)'); c.fillStyle = g; c.fillRect(x - 320, H - 320, 640, 320); }
      c.fillStyle = 'rgba(10,6,12,.8)'; for (let i = 0; i < 5; i++) { const x = 160 + i * 240, y = 140 + (i % 2) * 70; c.beginPath(); c.moveTo(x - 50, y); c.lineTo(x + 70, y - 8); c.lineTo(x + 70, y + 8); c.closePath(); c.fill(); }
    } else {
      c.strokeStyle = 'rgba(255,230,180,.9)'; c.lineWidth = 3;
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(W / 2 + i * 220, H); c.lineTo(W / 2 + i * 6, 250); c.stroke(); }
      const g = c.createRadialGradient(W / 2, 250, 0, W / 2, 250, 180); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(W / 2 - 200, 100, 400, 300);
    }
    c.restore();
  },
  draw(c) {
    const W = G.W, H = G.H, t = G.time, cl = this.clarity;
    A.voidBlue(c, t, 1);
    A.motes(c, t, 80, 'rgba(150,200,255,.5)', 3, 40 + cl * 60);
    // vision courante
    if (this.visK >= 0 && this.visT > 0) { const a = Math.min(smooth(0, 1, 6.5 - this.visT), smooth(0, 1.2, this.visT)); this.drawVision(c, this.visK, a); }
    // le fil (futurs voisins en filigrane)
    c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
    for (let strand = -2; strand <= 2; strand++) {
      const main = strand === 0;
      c.strokeStyle = main ? `rgba(255,${190 + cl * 50},${110 + cl * 100},.9)` : 'rgba(110,170,255,.22)';
      c.lineWidth = main ? 4 + cl * 3 : 1.6;
      if (main) { c.save(); c.strokeStyle = 'rgba(255,170,90,.22)'; c.lineWidth = 16 + cl * 6; c.beginPath(); for (let x = -10; x <= W + 10; x += 8) { const y = this.thread(x + this.scroll); x < 0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); c.restore(); }
      c.beginPath();
      for (let x = -10; x <= W + 10; x += 8) {
        const u = x + this.scroll, y = this.thread(u) + (main ? 0 : strand * (26 + 14 * Math.sin(u * 0.005 + strand)) * (1.3 - cl));
        x < 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.stroke();
    }
    c.restore();
    // gouffres
    for (const h of this.hits) {
      c.save(); c.translate(h.x, h.y); c.fillStyle = '#02030a'; c.beginPath();
      for (let i = 0; i < 14; i++) { const a = i / 14 * TAU, r = h.r * (0.75 + 0.35 * Math.sin(a * 3 + t * 2 + h.s) * Math.cos(a * 2 - t)); i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill(); c.strokeStyle = 'rgba(160,90,255,.5)'; c.lineWidth = 2; c.stroke(); c.restore();
    }
    // traîne et esprit
    this.parts.draw(c, 0, 0, 'lighter');
    c.save(); c.globalCompositeOperation = 'lighter';
    c.strokeStyle = this.on ? 'rgba(255,220,150,.5)' : 'rgba(120,180,255,.4)'; c.lineWidth = 3; c.beginPath(); this.trail.forEach((p, i) => (i ? c.lineTo(p.x - (this.t - p.t) * 200, p.y) : c.moveTo(p.x - (this.t - p.t) * 200, p.y))); c.stroke();
    const g = c.createRadialGradient(this.px, this.py, 0, this.px, this.py, 46); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.3, this.on ? 'rgba(255,200,120,.6)' : 'rgba(120,180,255,.6)'); g.addColorStop(1, 'rgba(60,120,255,0)');
    c.fillStyle = g; c.fillRect(this.px - 50, this.py - 50, 100, 100); c.restore();
    // bruit de visions brouillées quand on perd le fil
    if (!this.on) { c.fillStyle = `rgba(120,160,255,${0.05 + 0.05 * Math.random()})`; for (let i = 0; i < 6; i++) c.fillRect(0, Math.random() * H, W, 1 + Math.random() * 3); }
    if (this.flashBad > 0) { c.fillStyle = `rgba(120,40,200,${this.flashBad * 0.3})`; c.fillRect(0, 0, W, H); }
    // HUD
    G.text(c, 'CLARTÉ DES VISIONS', W / 2, 40, { size: 12, ls: 6, align: 'center', color: '#bcd4ff' });
    c.fillStyle = 'rgba(180,210,255,.18)'; c.fillRect(W / 2 - 200, 52, 400, 3);
    c.fillStyle = '#ffd28a'; c.fillRect(W / 2 - 200, 52, 400 * cl, 3);
    VISIONS.forEach((v) => { c.fillStyle = cl >= v[0] ? '#fff' : 'rgba(180,210,255,.4)'; c.fillRect(W / 2 - 200 + 400 * v[0] - 1, 48, 2, 11); });
    if (this.done) { c.fillStyle = `rgba(215,232,255,${smooth(0.2, 3.5, this.done)})`; c.fillRect(0, 0, W, H); }
  },
};
})();
